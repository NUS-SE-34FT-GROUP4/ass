# Full config for the full-context test (CI has no services containers).
# NOTE: this file shadows src/main/resources/application.properties entirely,
# so it must contain the complete configuration, not just overrides.
spring.application.name=c2c-chat
server.port=8082

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# No live MySQL/RabbitMQ in CI: exclude their health indicators so the
# health endpoint still reports UP.
management.health.db.enabled=false
management.health.rabbit.enabled=false

spring.datasource.url=jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
spring.datasource.username=tradeuser
spring.datasource.password=tradepass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=sg.edu.nus.iss.c2csectrade.chat.entity
mybatis.configuration.map-underscore-to-camel-case=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
# No broker in CI: don't start listeners (declared queues/bindings apply on connect).
spring.rabbitmq.listener.simple.auto-startup=false

# Static dummy secret (>= 64 bytes for HS512) instead of the JWT_SECRET env var.
app.jwtSecret=citest-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
app.jwtExpirationMs=3600000
