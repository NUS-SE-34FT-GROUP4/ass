spring.application.name=c2c-chat

# 8082 avoids clashing with Core when running locally; the container image
# sets SERVER_PORT=8080, the port every ECS service listens on.
server.port=8082

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# /actuator/health/liveness for the load balancer: it reports only whether the
# application itself is alive, so an outage of MySQL, Redis or RabbitMQ does not
# make ECS replace every task. Spring Boot enables it by default only on Kubernetes.
management.endpoint.health.probes.enabled=true

# Database (injected by compose and ECS like core; the password has no
# default so no credential ever lands in this file)
spring.datasource.url=jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tradeuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=sg.edu.nus.iss.c2csectrade.chat.entity
mybatis.configuration.map-underscore-to-camel-case=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# JWT (same property names as core, secret injected via env)
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=3600000
