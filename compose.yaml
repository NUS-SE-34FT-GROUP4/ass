
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: c2csectrade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: trade
      MYSQL_USER: tradeuser
      MYSQL_PASSWORD: tradepass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - c2csectrade-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: c2csectrade-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - c2csectrade-network

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: c2csectrade-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c2csectrade-network

  # OpenSearch: the same engine and version as Amazon OpenSearch Service on AWS
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: c2csectrade-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - c2csectrade-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: c2csectrade-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - c2csectrade-network

  # Backend Application (can be scaled to several instances)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c2csectrade-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useServerPrepStmts=true&cachePrepStmts=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: tradeuser
      SPRING_DATASOURCE_PASSWORD: tradepass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      # Keyword search; without Search, Core falls back to the database
      APP_SEARCH_URL: http://search:8080
      MINIO_ENDPOINT: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - c2csectrade-network
    restart: unless-stopped
    # Scale to several instances with --scale
    # deploy:
    #   replicas: 3

  # Search Service: consumes product events into the index and serves /api/search
  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: search
    container_name: c2csectrade-search
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_ELASTICSEARCH_URIS: http://opensearch:9200
      # Reads pms_product for the full index rebuild
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: tradeuser
      SPRING_DATASOURCE_PASSWORD: tradepass
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - c2csectrade-network
    restart: unless-stopped

  # Chat Service: handles WebSocket connections and chat message fanout
  chat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: chat
    container_name: c2csectrade-chat
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: tradeuser
      SPRING_DATASOURCE_PASSWORD: tradepass
      SPRING_RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - c2csectrade-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: c2csectrade-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - search
      - chat
    networks:
      - c2csectrade-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  opensearch-data:
    driver: local

networks:
  c2csectrade-network:
    driver: bridge

