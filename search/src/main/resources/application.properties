spring.application.name=c2c-search

# 8081 avoids clashing with Core when running locally; the container image
# sets SERVER_PORT=8080, the port every ECS service listens on.
server.port=8081

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Product index. On AWS, Terraform sets SPRING_ELASTICSEARCH_URIS for every
# service to the OpenSearch domain; locally it is the compose container.
app.opensearch.url=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
app.opensearch.index=products

# RabbitMQ: the compose broker by default; on AWS Terraform sets
# SPRING_RABBITMQ_HOST, _PORT, _SSL_ENABLED, _USERNAME and _PASSWORD.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
# A failed index write is retried before the message is given up
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
