spring.application.name=c2c-search

# 8081 avoids clashing with Core when running locally; the container image
# sets SERVER_PORT=8080, the port every ECS service listens on.
server.port=8081

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# /actuator/health/liveness for the load balancer: it reports only whether the
# application itself is alive, so an outage of MySQL, Redis or RabbitMQ does not
# make ECS replace every task. Spring Boot enables it by default only on Kubernetes.
management.endpoint.health.probes.enabled=true

# Product index. On AWS, Terraform sets SPRING_ELASTICSEARCH_URIS for every
# service to the OpenSearch domain; locally it is the compose container.
app.opensearch.url=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
app.opensearch.index=products

# Products, read to rebuild the whole index. On AWS, Terraform sets
# SPRING_DATASOURCE_URL and the search_svc credentials (SELECT on pms_product only).
spring.datasource.url=jdbc:mysql://localhost:3306/trade?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tradeuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Fail fast if MySQL stops answering, so a rebuild ends with 503 instead of
# hanging and blocking the next one. Core waits up to app.search.reindex-timeout.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=30000

# RabbitMQ: the compose broker by default; on AWS Terraform sets
# SPRING_RABBITMQ_HOST, _PORT, _SSL_ENABLED, _USERNAME and _PASSWORD.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
# A failed index write is retried before the message is given up
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
